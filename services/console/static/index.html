<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/static/img/mark.svg" type="image/svg+xml">

<body>

      <a class="product" href="#/investigations" aria-label="Investigation Console home">

        <span class="product-text">
          <span class="product-eyebrow">Prime Agent</span>
          <span class="product-name">Investigation Console</span>
        </span>
      </a>
      <nav class="nav" aria-label="Views">
        <a href="#/overview" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 5" /><path d="M3 21h18" /></svg>
          Overview
        </a>
        <a href="#/dataset" data-view="dataset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8" /><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5" /><path d="M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12" /></svg>

          Investigations
          <span class="nav-count" id="nav-count"></span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="partners">
          <div class="partner">
            <span class="partner-label">Runs on</span>
            <img class="logo-cloudera" src="/static/brand/cloudera-white.png" alt="Cloudera">
          </div>
          <div class="partner">
            <span class="partner-label">Models by</span>
            <img class="logo-mistral" src="/static/brand/mistral-lockup-dark.svg" alt="Mistral">
          </div>
        </div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/d3.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
